<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Master Linear Gradients -->
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4AB4FF" />
      <stop offset="100%" stop-color="#2B79C2" />
    </linearGradient>
    <linearGradient id="mintGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2BD9A0" />
      <stop offset="100%" stop-color="#00A86B" />
    </linearGradient>
    <linearGradient id="diagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3DA9FC" />
      <stop offset="50%" stop-color="#2BD9A0" />
      <stop offset="100%" stop-color="#3DA9FC" />
    </linearGradient>
    <filter id="subtleDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3.5" flood-color="#3DA9FC" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Chassis: Dark Navy Rounded Squircle with Precision Border -->
  <rect x="8" y="8" width="104" height="104" rx="26" fill="#102843" stroke="#1C3A56" stroke-width="2.5" />
  <rect x="10" y="10" width="100" height="100" rx="24" fill="none" stroke="rgba(61, 169, 252, 0.12)" stroke-width="1" />

  <!-- Symmetrical Dual-Engineering Monogram (MA + Code Bracket + Network Node) -->
  <g filter="url(#subtleDrop)">
    <!-- 1. The 'M' Frame (Software & Logic Architecture) -->
    <path d="M26 92 V28 L60 62 L94 28 V92" 
          fill="none" 
          stroke="url(#blueGlow)" 
          stroke-width="8.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- 2. The 'A' Apex (Infrastructure & Systems Apex) -->
    <path d="M43 92 L60 28 L77 92" 
          fill="none" 
          stroke="#EAF4FB" 
          stroke-width="6.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- 3. The 'A' Crossbar / Systems Bus Bridge -->
    <path d="M45 70 H75" 
          fill="none" 
          stroke="url(#mintGlow)" 
          stroke-width="5.5" 
          stroke-linecap="round" />

    <!-- 4. Central Network Node / Terminal Diamond Vertex -->
    <circle cx="60" cy="70" r="4.5" fill="#2BD9A0" />
    <circle cx="60" cy="70" r="2" fill="#0B1E33" />
  </g>
</svg>
